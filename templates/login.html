<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · 今天吃啥？</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #1b2b2a;
      background:
        radial-gradient(900px 520px at 10% -10%, #dff7ee 0%, rgba(223, 247, 238, 0) 60%),
        radial-gradient(820px 520px at 95% 0%, #e3f1fd 0%, rgba(227, 241, 253, 0) 58%),
        linear-gradient(180deg, #f8fcfa 0%, #f4f9fd 100%);
    }

    .box {
      width: 100%;
      max-width: 340px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 18px;
      box-shadow: 0 18px 44px rgba(20, 80, 72, 0.12);
      padding: 30px 26px 26px;
      text-align: center;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 21px;
      letter-spacing: 3px;
      background: linear-gradient(105deg, #0b9583, #2f96dd);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .sub {
      margin: 0 0 22px;
      font-size: 12px;
      letter-spacing: 2px;
      color: #94a9a6;
    }

    input {
      width: 100%;
      height: 40px;
      margin-bottom: 12px;
      padding: 0 14px;
      border: 1px solid #dcebe7;
      border-radius: 10px;
      background: #f8fcfb;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: all 0.16s ease;
    }

    input:focus {
      background: #fff;
      border-color: #0fae9b;
      box-shadow: 0 0 0 3px rgba(15, 174, 155, 0.12);
    }

    button {
      width: 100%;
      height: 40px;
      margin-top: 6px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #14bfa9, #0fa694);
      color: #fff;
      font-size: 14px;
      font-family: inherit;
      font-weight: 500;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(15, 174, 155, 0.28);
      transition: transform 0.16s ease, box-shadow 0.16s ease;
    }

    button:hover { transform: translateY(-1px); }
    button:disabled { opacity: .6; cursor: not-allowed; transform: none; }

    .msg {
      min-height: 18px;
      margin: 12px 0 0;
      font-size: 12.5px;
      color: #e05a72;
    }
  </style>
</head>
<body>

  <form class="box" id="form">
    <h1>今天吃啥？</h1>
    <p class="sub">先登录</p>

    <input id="username" type="text" placeholder="用户名" autocomplete="username" required>
    <input id="password" type="password" placeholder="密码" autocomplete="current-password" required>

    <button type="submit" id="btn">登 录</button>
    <p class="msg" id="msg"></p>
  </form>

  <script>
    const form = document.getElementById('form');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true;
      msg.textContent = '';

      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value,
          }),
        });

        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          msg.textContent = data.detail || '登录失败';
          btn.disabled = false;
          return;
        }

        window.location.href = '/';
      } catch (err) {
        msg.textContent = '网络错误：' + err.message;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
